version: "4.1"
name: The_Fourth_Assignment_1_2
type: ARM
deviceName: null
packDir: null
srcDirs:
  - Core
  - Drivers
virtualFolder:
  name: <virtual_root>
  files:
    - path: startup_stm32f103xb.s
  folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 88cacd41ce2f407ba2bbec786a1bdd61
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - USE_HAL_DRIVER
        - STM32F103xB
      incList:
        - Core/Inc
        - Drivers/STM32F1xx_HAL_Driver/Inc/Legacy
        - Drivers/STM32F1xx_HAL_Driver/Inc
        - Drivers/CMSIS/Device/ST/STM32F1xx/Include
        - Drivers/CMSIS/Include
      libList: []
    excludeList: []
    settings:
      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M3
        floatingPointHardware: none
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler: {}
          beforeBuildTasks:
            - name: STM32 AutoProject preflight
              command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "${ProjectRoot}/.stm32-auto/Build.ps1" -ProjectPath "${ProjectRoot}" -Check
              stopBuildAfterFailed: true
          c/cpp-compiler:
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: softfp
            arm-thumb-mode: thumb
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes: []
            $toolName: auto
            LD_FLAGS: ""
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: STM32F103xx_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      STLink:
        address: "0x08000000"
        bin: ""
        elFile: None
        optionBytes: .eide/debug.st.option.bytes.ini
        otherCmds: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
    uploader: STLink
